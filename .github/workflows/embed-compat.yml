name: Wix embed compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  embed:
    name: Boot every suite file inside a Wix-shaped embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble from parts
        run: python3 build/build.py && python3 build/build.py
      - name: Syntax-check the assembled script
        run: node --check build/out.js
      - name: Install test deps
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run embed compatibility suite
        run: npm test
