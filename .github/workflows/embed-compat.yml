name: Wix embed compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    name: Boot every suite file inside a Wix-shaped embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble from parts
        run: python3 build/build.py
      - name: Syntax-check the assembled script
        run: node --check build/out.js
      - name: Install test deps
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run embed compatibility suite
        id: embed
        continue-on-error: true
        run: npm test
      - name: Publish the report
        if: always()
        run: |
          git config user.name "prohub-ci"
          git config user.email "ci@localhost"
          if [ -f build/out/report.json ]; then
            cat build/out/report.json
            git checkout -b ci-report >/dev/null 2>&1 || git checkout ci-report
            git add -f build/out/report.json
            git commit -m "ci: embed compatibility report [skip ci]" || echo "nothing to commit"
            git push -f origin ci-report && echo "report pushed to ci-report" || echo "push skipped"
          else
            echo "no report produced"
          fi
      - name: Fail the job if the suite failed
        if: steps.embed.outcome == 'failure'
        run: exit 1
