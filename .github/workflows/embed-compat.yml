name: Wix embed compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Limit the run to one file (blank = all). e.g. prehub or posthub'
        required: false
        default: ''
      promote:
        description: 'Allow promotion to main if the verdict is PASS'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  embed:
    name: Boot every suite file inside a Wix-shaped embed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble every app from its parts
        run: python3 build/build.py
      - name: Syntax-check each assembled script
        run: |
          fail=0
          for f in build/out/*.js; do
            echo "-- $f"
            node --check "$f" || fail=1
          done
          exit $fail
      - name: Syntax-check the harness
        run: node --check tests/embed.spec.mjs
      - name: Install test deps
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run embed compatibility suite
        id: embed
        continue-on-error: true
        env:
          TARGET_FILTER: ${{ github.event.inputs.target }}
        run: npm test
      - name: Publish the report
        if: always()
        run: |
          git config user.name "prohub-ci"
          git config user.email "ci@localhost"
          ls -l build/out/ || true
          if [ -f build/out/report.json ]; then
            echo "--- report being published ---"
            head -c 300 build/out/report.json; echo
            cat build/out/report.json
            # reset the branch every run: a persistent ci-report served a stale file for hours
            git checkout -B main origin/main
            git branch -D ci-report >/dev/null 2>&1 || true
            git checkout -B ci-report
            git add -f build/out/report.json
            git commit -m "ci: embed compatibility report [skip ci]" || echo "nothing to commit"
            git push -f origin ci-report && echo "report pushed to ci-report" || echo "push skipped"
          else
            echo "no report produced - the suite did not reach its write step"
          fi
      - name: Promote if the suite proved the build
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.promote == 'true')
        run: python3 build/promote.py
      - name: Fail the job if the suite failed
        if: steps.embed.outcome == 'failure'
        run: exit 1
