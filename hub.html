<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>proHUB | Production Suite</title>
<style>
:root{--ink:#0A0E16;--panel:#101725;--line:#1E2A3E;--paper:#F6F4EF;--amber:#E2A93B;--lime:#8FC13F;--red:#D64541;--mu:#8493A8;--fd:"Iowan Old Style",Georgia,"Times New Roman",serif;--fs:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ink);color:#E6EBF2;font-family:var(--fs);overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-family:var(--fd);font-size:22px;letter-spacing:.01em;color:#fff}
.brand i{color:var(--amber);font-style:normal}
.tag{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.spacer{flex:1}
.live{font-family:var(--fm);font-size:11.5px;color:var(--lime)}
.live b{color:#fff}
#tgrid{flex:1 1 auto;display:grid;gap:12px;padding:16px;overflow:auto;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .15s,transform .12s}
.tile:hover{border-color:#33456A;transform:translateY(-1px)}
.tile .dot{width:9px;height:9px;border-radius:50%}
.tile h2{font-family:var(--fd);font-size:19px;margin:0;color:#fff;font-weight:600}
.tile p{margin:0;font-size:12.5px;color:var(--mu);line-height:1.5}
.tile .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F7F96}
.tile.big{grid-column:span 2;grid-row:span 2}
#modal{position:fixed;inset:0;display:none;background:rgba(4,7,12,.86);z-index:50;padding:12px}
#modal.on{display:block}
.mbox{background:var(--ink);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;height:100%}
.mhd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.mhd h2{font-family:var(--fd);font-size:21px;margin:0;color:#fff}
.mhd .k{font-family:var(--fm);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.mbody{flex:1 1 auto;overflow:auto;padding:16px}
button{font-family:var(--fs);font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:#16202F;color:#DDE5EF;cursor:pointer}
button:hover{background:#1D293B}
button.pri{background:var(--amber);border-color:var(--amber);color:#12161F;font-weight:600}
textarea,input,select{width:100%;background:#0D1420;border:1px solid var(--line);border-radius:7px;color:#E6EBF2;padding:9px 10px;font-family:var(--fm);font-size:13px;line-height:1.6}
textarea:focus,input:focus{outline:2px solid var(--amber);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mu);line-height:1.6}

/* the master import: one strip at the top of proHUB, above the tiles */
.ibar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid var(--line);background:#0C1220;flex:0 0 auto}
.ibar .lbl{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.ibar .state{font-size:12.5px;color:var(--mu)}
.ibar button.pri{background:var(--amber);border-color:var(--amber);color:#12161F;font-weight:600}
.histsel{max-width:280px;height:28px;font-size:12px;padding:2px 6px;background:#0D1420;border:1px solid var(--line);border-radius:6px;color:#E6EBF2}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="brand">pro<i>HUB</i></div>
  <div class="tag" id="tagline">production suite</div>
  <div class="spacer"></div>
  <div class="live" id="livebox">bus <b id="tagcount">0</b> tags</div>
 </header>
 <div class="ibar">
  <span class="lbl">Script</span>
  <button id="tiPick" class="pri">Import script</button>
  <input id="tiFile" type="file" accept=".pdf,.fdx,.json,.fountain,.txt" hidden>
  <button id="tiProfile">Load from member</button>
  <button id="tiPaste">Paste</button>
  <select id="tiHist" class="histsel"><option value="">history (0)</option></select>
  <span class="state" id="tiState">no script loaded</span>
 </div>
 <div id="tgrid"></div>
</div>
<div id="modal">
 <div class="mbox">
  <div class="mhd">
   <div><div class="k" id="mkey">modality</div><h2 id="mtitle">-</h2></div>
   <div class="spacer"></div>
   <button id="mclose">Close</button>
  </div>
  <div class="mbody" id="mbody"></div>
 </div>
</div>
<script>
;
/* modalsync */
(function(){
/* ModalSync - the tag bus. Everything a modality knows that another needs goes here,
   published under a tag, so tiles stay decoupled. Persisted per tag, versioned, and with a
   wildcard subscription for the harness. */
window.ModalSync=(function(){
 var data={},subs={},vers={};
 function ls(tag){try{var r=localStorage.getItem('ms:'+tag);return r?JSON.parse(r):null}catch(e){return null}}
 function save(tag,rec){try{localStorage.setItem('ms:'+tag,JSON.stringify(rec))}catch(e){}}
 function publish(tag,payload,source){
  var rec={tag:tag,data:payload,source:source||'',version:(vers[tag]||0)+1,updatedAt:new Date().toISOString()};
  vers[tag]=rec.version;data[tag]=rec;save(tag,rec);
  var list=(subs[tag]||[]).slice();
  for(var i=0;i<list.length;i++){try{list[i](rec)}catch(e){}}
  var all=(subs['*']||[]).slice();
  for(var j=0;j<all.length;j++){try{all[j](rec)}catch(e){}}
  try{if(window.HUB&&HUB.busTick)HUB.busTick()}catch(e){}
  return rec;
 }
 function subscribe(tag,cb){(subs[tag]=subs[tag]||[]).push(cb);
  return function(){(subs[tag]||[]).filter(function(f){return f!==cb})}}
 function getWithMetadata(tag){return data[tag]||ls(tag)}
 function get(tag){var r=getWithMetadata(tag);return r?r.data:null}
 function watch(tag,cb){subscribe(tag,cb);var cur=getWithMetadata(tag);if(cur){try{cb(cur)}catch(e){}}}
 function getAllData(){var o={};for(var k in data){if(data[k])o[k]=data[k].data}return o}
 function getTags(){var t={};for(var k in data){t[k]=1}
  try{for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key&&key.indexOf('ms:')===0)t[key.slice(3)]=1}}catch(e){}
  return Object.keys(t)}
 function publishMultiple(obj,source){for(var k in obj){publish(k,obj[k],source)}}
 return {publish:publish,subscribe:subscribe,watch:watch,get:get,getWithMetadata:getWithMetadata,
         getAllData:getAllData,getTags:getTags,publishMultiple:publishMultiple};
})();
})();
;
/* bridge */
(function(){
/* the profile bridge: the bus talks to the member's profile, not to this browser.
   Inside a Wix embed there is no access to Wix APIs, so every read and write goes out as a
   postMessage to the page, where Velo does the wix-data call. Standalone (no parent, or no
   answer within 1200ms) it falls back to localStorage so the app still works on a laptop. */
var HubBridge=(function(){
 var KEY='prohub_profile_v1', pending={}, seq=0, timer=null, mode='local';
 function post(msg){ try{ if(window.parent&&window.parent!==window) window.parent.postMessage(msg,'*'); return true }catch(e){ return false } }
 function readLocal(){ try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null} }
 function writeLocal(v){ try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){return false} }
 function apply(profile,fromLocal){
  if(!profile) return;
  var tags=profile.tags||{};
  for(var k in tags){ try{ ModalSync.publish(k,tags[k],'profile') }catch(e){} }
  if(profile.script!=null){ try{ ModalSync.publish('screenplay:main',{content:profile.script},'profile') }catch(e){} }
  mode=fromLocal?'local':'profile';
 }
 function snapshot(){
  var out={version:1,updatedAt:new Date().toISOString(),tags:{},script:null};
  try{ out.tags=ModalSync.getAllData() }catch(e){}
  try{ var s=ModalSync.get('screenplay:main'); if(s&&s.content!=null) out.script=s.content }catch(e){}
  return out;
 }
 function save(reason){
  var prof=snapshot();
  if(mode==='profile'){
   var id=++seq;
   pending[id]=true;
   post({hub:'profile:save',id:id,reason:reason||'auto',profile:prof});
   setTimeout(function(){ if(pending[id]){ delete pending[id]; writeLocal(prof) } },2500);
  } else writeLocal(prof);
  return prof;
 }
 function queueSave(reason){
  if(timer) clearTimeout(timer);
  timer=setTimeout(function(){ save(reason) },900);
 }
 function load(){
  var sent=post({hub:'profile:load'});
  if(!sent){ var p0=readLocal(); if(p0) apply(p0,true); return true; }
  setTimeout(function(){ if(mode!=='profile'){ var p1=readLocal(); if(p1) apply(p1,true) } },1200);
  return true;
 }
 window.addEventListener('message',function(e){
  var d=e.data; if(!d||typeof d!=='object') return;
  if(d.hub==='profile'){ apply(d.profile); return }
  if(d.hub==='saved'&&d.id){ delete pending[d.id]; mode='profile'; return }
  if(d.hub==='tag'){ try{ ModalSync.publish(d.tag,d.data,'frame') }catch(err){} return }
 },false);
 function start(){
  if(window.ModalSync&&ModalSync.subscribe){
   ModalSync.subscribe('*',function(){ queueSave('auto') });
  }
  load();
  document.addEventListener('visibilitychange',function(){ if(document.hidden) save('hide') });
  window.addEventListener('beforeunload',function(){ save('unload') });
 }
 function history(){
  var r=ModalSync.get('imports:list');
  return (r&&r.items)?r.items:[];
 }
 function recordImport(meta){
  meta=meta||{};
  var entry={id:'imp'+Date.now(),at:new Date().toISOString(),
   filename:meta.filename||'(pasted text)',format:meta.format||'text',
   lines:meta.lines||0,scenes:meta.scenes||0,cast:meta.cast||0,content:meta.content||''};
  var items=history().slice(0);
  items.unshift(entry);
  items=items.slice(0,5);
  var total=0;
  items=items.filter(function(x){total+=(x.content||'').length;return total<400000});
  ModalSync.publish('imports:list',{items:items},'bridge');
  return entry;
 }
 return {start:start,save:save,load:load,snapshot:snapshot,history:(typeof history==='function')?history:function(){return []},recordImport:(typeof recordImport==='function')?recordImport:function(){return null},mode:function(){return mode},saveScript:function(meta){if(meta&&(meta.filename||meta.format)){try{recordImport(meta)}catch(e){}}var s=ModalSync.get('screenplay:main');return save('script:'+((s&&s.content)?s.content.length:0))}};
window.HubBridge=HubBridge;
})();
})();
;
/* hub */
(function(){
/* the tile host: registers modalities, lays them out to the viewport, opens them full screen
   and sizes itself again whenever the window changes. */
var TILES=[],OPEN=null;
function reg(t){TILES.push(t)}
function busTick(){var n=window.ModalSync?ModalSync.getTags().length:0;var el=document.getElementById('tagcount');if(el)el.textContent=n}
function layout(){
 var g=document.getElementById('tgrid');if(!g)return;
 var html=[];
 for(var i=0;i<TILES.length;i++){
  var t=TILES[i];
  html.push('<div class="tile'+(t.big?' big':'')+'" data-id="'+t.id+'">'+
   '<div class="row"><span class="dot" style="background:'+(t.colour||'#E2A93B')+'"></span>'+
   '<span class="k">'+(t.tag||'modality')+'</span></div>'+
   '<h2>'+esc(t.title)+'</h2><p>'+esc(t.sub||'')+'</p></div>');
 }
 g.innerHTML=html.join('');
 var tiles=g.querySelectorAll('[data-id]');
 for(var j=0;j<tiles.length;j++)tiles[j].onclick=function(){open(this.getAttribute('data-id'))};
 sizeGrid();
}
function sizeGrid(){
 var g=document.getElementById('tgrid');if(!g)return;
 var avail=g.clientWidth-32,availH=g.clientHeight-32;
 var cols=Math.max(2,Math.min(6,Math.floor(avail/230),Math.max(2,TILES.length)));
 var rows=Math.max(1,Math.round(availH/168));
 g.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
 g.style.gridAutoRows=Math.max(120,Math.floor(availH/rows))+'px';
}
function open(id){
 var t=null;
 for(var i=0;i<TILES.length;i++)if(TILES[i].id===id)t=TILES[i];
 if(!t)return;
 OPEN=t;
 var m=document.getElementById('modal');
 m.classList.add('on');document.body.style.overflow='hidden';
 document.getElementById('mtitle').textContent=t.title;
 document.getElementById('mkey').textContent=t.tag||'modality';
 var body=document.getElementById('mbody');
 body.innerHTML='';
 try{t.render(body)}catch(e){body.innerHTML='<p class="note">That modality failed to open: '+esc(e.message)+'</p>'}
 autosize();
}
function close(){
 OPEN=null;
 document.getElementById('modal').classList.remove('on');
 document.body.style.overflow='';
 var body=document.getElementById('mbody');if(body)body.innerHTML='';
}
function autosize(){
 var m=document.getElementById('modal').querySelector('.mbox');
 if(!m)return;
 m.style.height=(window.innerHeight-24)+'px';
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function boot(){
 layout();
 document.getElementById('mclose').onclick=close;
 document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)close()});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&OPEN)close()});
 window.addEventListener('resize',function(){sizeGrid();if(OPEN)autosize()});
 busTick();
 if(window.HUB_READY)HUB_READY();
}
window.HUB={reg:reg,open:open,close:close,boot:boot,layout:layout,sizeGrid:sizeGrid,tiles:function(){return TILES.map(function(t){return t.id})},busTick:busTick,esc:esc};
window.HUB_READY=function(){document.getElementById('tagline').textContent='production suite · '+TILES.length+' modalities'};
})();
;
/* import */
(function(){
var HubImport=(function(){
 var TYPES={ 'scene heading':'SCENE_HEADING','scene':'SCENE_HEADING','action':'ACTION','character':'CHARACTER',
  'parenthetical':'PARENTHETICAL','dialogue':'DIALOGUE','transition':'TRANSITION','general':'ACTION','shot':'ACTION' };
 function norm(t){return String(t||'').replace(/\r/g,'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim()}
 function classifyLines(raw){
  var out=[],prev=null,lines=String(raw||'').replace(/\r/g,'').split('\n');
  for(var i=0;i<lines.length;i++){
   var t=norm(lines[i]); if(!t){prev=null;continue}
   var up=t.toUpperCase();
   if(/^\s*(?:\d+[A-Za-z]?[.)]?\s+)?(?:INT|EXT|EST|I\/E|INT\.?\/EXT|EXT\.?\/INT)\b[.\s\/]/i.test(t)){out.push({type:'SCENE_HEADING',text:up});prev='h';continue}
   if(/^(FADE IN|FADE OUT|FADE TO|CUT TO|SMASH TO|SMASH CUT|MATCH CUT|DISSOLVE TO|HARD CUT)/i.test(t)||/\bTO:\s*$/.test(t)){out.push({type:'TRANSITION',text:up});prev='t';continue}
   if(/^\(.*\)$/.test(t)){out.push({type:'PARENTHETICAL',text:t});prev='p';continue}
   if(up===t&&t.length<44&&!/[.,!?]$/.test(t)&&!/[:;]/.test(t)&&!/^\d+$/.test(t)){out.push({type:'CHARACTER',text:up});prev='c';continue}
   if(prev==='c'||prev==='p'||prev==='d'){
    var isAct=(prev==='d'&&/[.!?]$/.test(t)&&t.split(/\s+/).length>6&&!/^[(]/.test(t));
    if(isAct){out.push({type:'ACTION',text:t});prev='a';continue}
    out.push({type:'DIALOGUE',text:t});prev='d';continue}
   out.push({type:'ACTION',text:t});prev='a';
  }
  return out;
 }
 function parseFdx(text){
  var doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('that .fdx would not parse as XML');
  var ps=doc.getElementsByTagName('Paragraph'),out=[];
  for(var i=0;i<ps.length;i++){
   var p=ps[i],ty=String(p.getAttribute('Type')||'Action'),tx='';
   var texts=p.getElementsByTagName('Text');
   for(var j=0;j<texts.length;j++)tx+=(j?' ':'')+texts[j].textContent;
   tx=norm(tx); if(!tx)continue;
   out.push({type:TYPES[ty.toLowerCase()]||'ACTION',text:tx});
  }
  if(!out.length)throw new Error('no paragraphs found in that .fdx');
  return out;
 }
 function pickType(o){var t=String(o.type||o.Type||o.kind||o.element||'').toLowerCase();return TYPES[t]||null}
 function parseJson(text){
  var j=JSON.parse(text),arr=null;
  if(Array.isArray(j))arr=j;
  else if(j&&Array.isArray(j.elements))arr=j.elements;
  else if(j&&Array.isArray(j.lines))arr=j.lines;
  else if(j&&Array.isArray(j.paragraphs))arr=j.paragraphs;
  else if(j&&j.tags&&j.tags['screenplay:main']){
   var m=j.tags['screenplay:main'],c=(m.data&&m.data.content)||m.content||'';
   if(c)return classifyLines(c);
  }
  if(arr&&arr.length){
   var out=[];
   for(var i=0;i<arr.length;i++){
    var o=arr[i];
    if(typeof o==='string'){out.push({type:'ACTION',text:norm(o)});continue}
    var tt=pickType(o),tx=norm(o.text||o.Text||o.content||o.value||o.body||'');
    if(!tx)continue;
    out.push({type:tt||'ACTION',text:tx});
   }
   if(out.length)return out;
  }
  var raw=(j&&(j.script||j.content||j.text||j.body))||'';
  if(raw)return classifyLines(raw);
  throw new Error('that .json has no script lines I recognise');
 }
 function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
   var s=document.createElement('script');
   s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
   s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}res(window.pdfjsLib)};
   s.onerror=function(){rej(new Error('the PDF reader could not load - it needs a connection the first time'))};
   document.head.appendChild(s);
  });
 }
 function parsePdf(buf){
  return loadPdfJs().then(function(lib){return lib.getDocument({data:buf}).promise})
   .then(function(doc){var ps=[];for(var p=1;p<=doc.numPages;p++)ps.push(doc.getPage(p));return Promise.all(ps)})
   .then(function(pages){return Promise.all(pages.map(function(pg){return pg.getTextContent()}))})
   .then(function(cont){
    var lines=[];
    cont.forEach(function(tc){
     var rows={};
     (tc.items||[]).forEach(function(it){
      if(!it.str||!it.str.trim())return;
      var y=Math.round((it.transform?it.transform[5]:0)/3)*3;
      rows[y]=(rows[y]||'')+it.str;
     });
     Object.keys(rows).sort(function(a,b){return b-a}).forEach(function(y){lines.push(rows[y])});
    });
    return classifyLines(lines.join('\n'));
   });
 }
 function analyse(lines){
  var cast=[],locs=[],scenes=[],n=0;
  for(var i=0;i<lines.length;i++){
   var l=lines[i],t=l.text||'';
   if(l.type==='SCENE_HEADING'){n++;
    var m=/^(INT|EXT|INT\/EXT|EST)[.\s\/]*\s*([^-\u2013]+?)(?:\s*[-\u2013]\s*(.+))?$/i.exec(t);
    var loc=((m&&m[2])?m[2]:t).trim().toUpperCase();
    scenes.push({num:n,head:t,loc:loc});
    if(loc&&locs.indexOf(loc)<0)locs.push(loc);}
   if(l.type==='CHARACTER'){var c=t.replace(/\(.*\)/g,'').trim().toUpperCase();if(c&&cast.indexOf(c)<0)cast.push(c)}
  }
  return {cast:cast,locations:locs,scenes:scenes};
 }
 function textOf(lines){return lines.map(function(l){return l.text}).join('\n')}
 function publish(result){
  var a=analyse(result.lines);
  var payload={format:result.format,filename:result.filename||'',updatedAt:new Date().toISOString(),
   content:textOf(result.lines),lines:result.lines,scenes:a.scenes,cast:a.cast,locations:a.locations,confidence:result.confidence};
  ModalSync.publishMultiple({'screenplay:main':payload,'cast:updated':{cast:a.cast,source:result.format},
   'locations:updated':{locations:a.locations,source:result.format},'scenes:list':{scenes:a.scenes,source:result.format}},'import');
  return {lines:result.lines.length,scenes:a.scenes.length,cast:a.cast.length,locations:a.locations.length};
 }
 function fromFile(file){
  var name=(file.name||'').toLowerCase(),ext=name.split('.').pop();
  if(ext==='pdf')return file.arrayBuffer().then(parsePdf).then(function(lines){
   return {format:'PDF',filename:file.name,lines:lines,confidence:'classified from page text - check the element types'}});
  return file.text().then(function(txt){
   if(ext==='fdx')return {format:'Final Draft',filename:file.name,lines:parseFdx(txt),confidence:'typed by the file'};
   if(ext==='json')return {format:'JSON',filename:file.name,lines:parseJson(txt),confidence:'typed where the file says, classified otherwise'};
   return {format:(ext==='fountain'?'Fountain':'plain text'),filename:file.name,lines:classifyLines(txt),confidence:'classified from the text'};
  });
 }
 return {fromFile:fromFile,parseFdx:parseFdx,parseJson:parseJson,classifyLines:classifyLines,parsePdf:parsePdf,
  analyse:analyse,publish:publish,publishLines:function(lines,f,n){return publish({lines:lines,format:f||'text',filename:n||''})}};
})();
window.HubImport=HubImport;
HUB.reg({id:'import',title:'Import script',sub:'PDF, FDX, WriterDuet JSON, Fountain - syncs every tile',tag:'import',colour:'#A78BFA',
 render:function(box){
  box.innerHTML='<div class="row" style="margin-bottom:10px"><input id="iFile" type="file" accept=".pdf,.fdx,.json,.fountain,.txt" style="flex:1"></div>'+
   '<div class="row" style="margin-bottom:10px"><button class="pri" id="iRun">Read and sync</button>'+
   '<button id="iPaste">Paste text instead</button><span class="note" id="iState">&nbsp;</span></div>'+
   '<textarea id="iPasteBox" rows="10" style="display:none" placeholder="Paste a screenplay or Fountain text here"></textarea>'+
   '<div id="iReport" style="margin-top:10px"></div>'+
   '<p class="note" style="margin-top:12px">FDX and JSON carry element types. A PDF does not - it is only positions on a page - so those lines are classified by shape and case. Check the result before you trust it.</p>';
  function report(r){document.getElementById('iReport').innerHTML='<div class="row" style="gap:14px;flex-wrap:wrap">'+
   '<span class="note"><b>'+r.lines+'</b> lines</span><span class="note"><b>'+r.scenes+'</b> scenes</span>'+
   '<span class="note"><b>'+r.cast+'</b> characters</span><span class="note"><b>'+r.locations+'</b> locations</span></div>'+

  document.getElementById('iPaste').onclick=function(){var t=document.getElementById('iPasteBox');t.style.display=t.style.display==='none'?'block':'none'};
  document.getElementById('iRun').onclick=function(){
   var st=document.getElementById('iState');
   var f=document.getElementById('iFile').files&&document.getElementById('iFile').files[0];
   var pasted=document.getElementById('iPasteBox').value;
   function done(res){var r=HubImport.publish(res);st.textContent=res.format+' · '+(res.confidence||'');report(r)}
   function fail(e){st.textContent='failed: '+e.message}
   if(f){st.textContent='reading '+f.name+'…';HubImport.fromFile(f).then(done).catch(fail);return}

/* top import */
(function(){
/* the master import strip. Three ways in - the member's saved profile, a file, or pasted text -
   and every one of them ends in the same place: HubImport parses it and publishes
   screenplay:main, cast:updated, locations:updated and scenes:list, so every tile has it at once.

   Formats: .fdx (final draft - typed), .json (writerduet or a saved profile - typed where it
   says so), .pdf (positions on a page - classified), .fountain/.txt (classified). */
(function () {
  function el(id) { return document.getElementById(id); }
  function say(msg) { var s = el('tiState'); if (s) s.textContent = msg; }

  function announce(res, counts) {
    var content = (res.lines || []).map(function (l) { return l.text; }).join('\n');
    say(res.format + ' · ' + counts.lines + ' lines · ' + counts.scenes + ' scenes · ' +
        counts.cast + ' characters · ' + counts.locations + ' locations');
    try {
      HubBridge.saveScript({ filename: res.filename || '(pasted text)', format: res.format,
                             lines: counts.lines, scenes: counts.scenes, cast: counts.cast,
                             content: content });
    } catch (e) {}
    fillHistory();
  }

  function fmtWhen(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso || ''; }
  }

  function fillHistory() {
    var sel = el('tiHist');
    if (!sel) return;
    var items = [];
    try { items = HubBridge.history() || []; } catch (e) {}
    var opts = ['<option value="">history (' + items.length + ')</option>'];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      opts.push('<option value="' + it.id + '">' + fmtWhen(it.at) + ' · ' +
                HUB.esc(it.filename || '') + ' · ' + (it.lines || 0) + ' lines</option>');
    }
    sel.innerHTML = opts.join('');
    sel.onchange = function () {
      var id = this.value;
      if (!id) return;
      var found = null;
      for (var k = 0; k < items.length; k++) if (items[k].id === id) found = items[k];
      if (!found) return;
      var lines = HubImport.classifyLines(found.content || '');
      var counts = HubImport.publish({ format: found.format || 'text', filename: found.filename || '',
                                       lines: lines, confidence: 'reverted from import history (' + fmtWhen(found.at) + ')' });
      say('reverted to ' + (found.filename || 'earlier import') + ' · ' + counts.lines + ' lines · ' + counts.scenes + ' scenes');
      this.value = '';
    };
  }

  function parseAndPublish(res) {
    var counts = HubImport.publish(res);
    announce(res, counts);
    return counts;
  }

  function fromFile(file) {
    say('reading ' + file.name + '…');
    HubImport.fromFile(file).then(parseAndPublish).catch(function (e) {
      say('could not read that file: ' + ((e && e.message) || e));
    });
  }

  function fromText(text) {
    if (!text || !text.trim()) { say('nothing pasted'); return; }
    parseAndPublish({ format: 'pasted text', filename: '', lines: HubImport.classifyLines(text),
                      confidence: 'classified from the text' });
  }

  function fromProfile() {
    say('asking the member profile…');
    try { HubBridge.load(); } catch (e) {}
    setTimeout(function () {
      var sp = ModalSync.get('screenplay:main');
      if (sp && sp.content) {
        var lines = (sp.lines && sp.lines.length) ? sp.lines.length : (sp.content || '').split('\n').length;
        say('from the member profile · ' + lines + ' lines · ' + ((sp.scenes || []).length) + ' scenes');
      } else {
        say('no script in the profile yet');
      }
    }, 1400);
  }

  function pasteDialog() {
    var t = window.prompt('Paste a screenplay, Fountain or plain text:', '');
    if (t) fromText(t);
  }

  function start() {
    var pick = el('tiPick'), input = el('tiFile'), prof = el('tiProfile'), past = el('tiPaste');
    if (pick && input) pick.onclick = function () { input.click(); };
    if (input) input.onchange = function () { if (this.files && this.files[0]) fromFile(this.files[0]); };
    if (prof) prof.onclick = fromProfile;
    if (past) past.onclick = pasteDialog;
    fillHistory();

    // a profile that arrives from the page should be reported here too
    try {
      ModalSync.watch('screenplay:main', function (rec) {
        if (rec.source === 'profile') {
          var d = rec.data || {};
          var n = (d.lines && d.lines.length) ? d.lines.length : (d.content || '').split('\n').length;
          say('from the member profile · ' + n + ' lines · ' + ((d.scenes || []).length) + ' scenes');
        }
      });
    } catch (e) {}
  }

  // test hook: run an import without the file picker
  window.TopImport = { run: parseAndPublish, fromText: fromText, fromProfile: fromProfile, history: fillHistory };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
})();

/* production desk tiles */
(function(){
/* The production desk, ported into the tiles rather than framed.

   desk/schedule.html carries the whole app: all nine sections plus its CSS and script. It is
   fetched ONCE, its styles and script are injected into this document once, and each tile then
   moves its own <section> into the panel. Nine tiles, one running instance, no iframes.

   Why move the node instead of copying markup: the app's own code finds its views with
   getElementById, and a moved node keeps its identity - so the schedule builder, the call sheet
   renderer and the budget totals keep working on the section they were written for. */
var DESK = { loaded: false, loading: null, source: 'desk/schedule.html' };
var DESK_VIEWS = ['schedule','callsheet','screenplay','cast','shots','props','budget','indieplus','shootingscript'];
var DESK_LABEL = {
  schedule:'One-line schedule', callsheet:'Call sheets', screenplay:'Screenwriter', cast:'Crew and cast',
  shots:'A/V studio', props:'Assets and locations', budget:'Standard budget',
  indieplus:'indiePLUS', shootingscript:'Shooting script'
};

function deskLoad() {
  if (DESK.loaded) return Promise.resolve(true);
  if (DESK.loading) return DESK.loading;
  DESK.loading = fetch(DESK.source, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');

      // 1. styles, once
      var styles = doc.querySelectorAll('style');
      for (var i = 0; i < styles.length; i++) {
        var s = document.createElement('style');
        s.textContent = styles[i].textContent;
        s.setAttribute('data-desk', '1');
        document.head.appendChild(s);
      }
      // the tab strip belongs to the tabbed desk, not to a tile
      var hide = document.createElement('style');
      hide.setAttribute('data-desk', '1');
      hide.textContent = '#tab-navigation{display:none !important}';
      document.head.appendChild(hide);

      // 2. markup into a detached host - it is never displayed, only moved from
      var host = document.createElement('div');
      host.id = 'deskHost';
      host.style.display = 'none';
      host.innerHTML = doc.body.innerHTML;
      document.body.appendChild(host);

      // 3. the script, once, after the markup exists
      var scripts = doc.querySelectorAll('script');
      for (var j = 0; j < scripts.length; j++) {
        if (scripts[j].src) continue;                 // no external loads
        try {
          var el = document.createElement('script');
          el.textContent = scripts[j].textContent;
          document.body.appendChild(el);
        } catch (e) { console.warn('desk script failed:', e && e.message); }
      }

      // 4. some builds wait for DOMContentLoaded, which has already fired here
      try { document.dispatchEvent(new Event('DOMContentLoaded')); } catch (e) {}
      try { window.dispatchEvent(new Event('load')); } catch (e) {}

      DESK.loaded = true;
      return true;
    });
  return DESK.loading;
}

function deskMount(view, box) {
  // ask the app to switch first, so anything it renders on activation happens
  var btn = document.getElementById('tab-' + view);
  if (btn) { try { btn.click(); } catch (e) {} }

  var slot = document.createElement('div');
  slot.style.cssText = 'height:100%;overflow:auto';
  box.innerHTML = '';
  box.appendChild(slot);

  var host = document.getElementById('deskHost');
  for (var i = 0; i < DESK_VIEWS.length; i++) {
    var v = DESK_VIEWS[i];
    var sec = host ? host.querySelector('#view-' + v) : null;
    if (!sec) continue;
    if (v === view) {
      sec.classList.remove('hidden');
      slot.appendChild(sec);            // the node moves, keeping its listeners and its id
    } else {
      sec.classList.add('hidden');
    }
  }
  if (!slot.children.length) {
    slot.innerHTML = '<p class="note">That section did not render. The desk loaded but ' +
      '“' + HUB.esc(view) + '” produced nothing - check the console for an error from the desk script.</p>';
  }
}

for (var k = 0; k < DESK_VIEWS.length; k++) {

/* rules engine */
(function(){
/* Storyboard rules engine and script sync.

   No AI, no network, deterministic. Every inference is a set of scored keyword matches, and the
   engine returns the scores it used - so a director can see exactly why a frame was called MCU.

   spec: four axes, each a list of [regex, value, points]; all matching rules accumulate toward
   their value, highest total wins, fallbacks apply when nothing fires. */
var SB_RULES = {
  size: [
    [/aerial|drone shot|birds.?eye|extreme wide|establishing shot/, 'ELS', 10],
    [/wide shot|wide angle|master shot|full shot/, 'WS', 9],
    [/exterior/, 'WS', 6],
    [/medium shot|waist up|two shot|over the shoulder/, 'MS', 9],
    [/dialogue|conversation|sitting/, 'MS', 7],
    [/medium close|chest up|medium close.?up/, 'MCU', 9],
    [/close.?up|\bface\b|reaction|tight on/, 'CU', 9],
    [/extreme close|eyes only|detail shot|macro/, 'ECU', 10],
    [/texture|insert shot/, 'ECU', 7]
  ],
  angle: [
    [/low angle|worm.?s eye|from below|ground level/, 'LOW', 9],
    [/high angle|overhead|bird.?s eye|looking down/, 'HIGH', 9],
    [/point of view|pov shot|first person|through his eyes/, 'POV', 9],
    [/dutch angle|canted|tilted frame/, 'DUTCH', 8],
    [/eye level/, 'EYE', 6]
  ],
  movement: [
    [/\bpan\b|panning|pan left|pan right|swish pan/, 'PAN', 8],
    [/tilt up|tilt down|tilting/, 'TILT', 8],
    [/dolly in|dolly out|dolly shot|dolly/, 'DOLLY', 8],
    [/tracking shot|follow shot|trucking/, 'TRACK', 8],
    [/crane shot|\bjib\b|boom shot/, 'CRANE', 8],
    [/hand.?held|shaky cam|verit/, 'HANDHELD', 9],
    [/steadicam|stabilized|smooth follow/, 'STEADICAM', 9],
    [/zoom in|zoom out|push zoom|smash zoom/, 'ZOOM', 8],
    [/one.?r\b|one shot|continuous take|unbroken/, 'ONER', 9]
  ],
  lighting: [
    [/golden hour|magic hour|sunrise|sunset/, 'GOLDEN', 9],
    [/warm light|late afternoon/, 'GOLDEN', 7],
    [/low key|noir|shadows|dark alley|moonlight/, 'LOW_KEY', 8],
    [/night/, 'LOW_KEY', 7],
    [/single source|candle|flashlight/, 'LOW_KEY', 8],
    [/neon|cyberpunk|fluorescent|club lighting/, 'NEON', 9],
    [/bright|well lit|daytime interior|studio/, 'HIGH_KEY', 7],
    [/white/, 'HIGH_KEY', 4],
    [/natural light|sunlight|overcast|diffused light/, 'NATURAL', 7],
    [/exterior/, 'NATURAL', 6]
  ]
};

function sbScore(text, rules) {
  var acc = {}, best = null, bestPts = 0;
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0].test(text)) {
      var v = rules[i][1], p = rules[i][2];
      acc[v] = (acc[v] || 0) + p;
      if (acc[v] > bestPts) { bestPts = acc[v]; best = v; }
    }
  }
  return { value: best, points: bestPts, scores: acc };
}

function inferShot(heading, action) {
  var h = String(heading || '').toUpperCase();
  var text = (String(heading || '') + ' ' + String(action || '')).toLowerCase();
  var s = sbScore(text, SB_RULES.size);
  var a = sbScore(text, SB_RULES.angle);
  var m = sbScore(text, SB_RULES.movement);
  var l = sbScore(text, SB_RULES.lighting);
  var isExt = /\bEXT\b/.test(h), isNight = /NIGHT/.test(h);
  var out = {
    size: s.value || (isExt ? 'WS' : 'MS'),
    angle: a.value || 'EYE',
    movement: m.value || 'STATIC',
    lighting: l.value || (isNight ? 'LOW_KEY' : (isExt ? 'NATURAL' : 'HIGH_KEY')),
    why: { size: s.scores, angle: a.scores, movement: m.scores, lighting: l.scores },
    fallback: { size: !s.value, angle: !a.value, movement: !m.value, lighting: !l.value }
  };
  return out;
}

/* ---- script scenes ---- */
function sbNormHeading(t) {
  // scene numbers are production bookkeeping, not part of the location: "1 INT. DINER" and
  // "INT. DINER" must key to the same scene or sync invents duplicates beside the real frame
  return String(t || '')
    .replace(/^\s*\d+[A-Za-z]?[.)]?\s+/, '')
    .replace(/\s+/g, ' ').trim().toUpperCase();
}
function sbBaseHeading(t) {
  return sbNormHeading(t).replace(/\s*[-\u2013]\s*(DAY|NIGHT|DAWN|DUSK|LATER|CONTINUOUS|MOMENTS LATER)\s*$/i, '').trim();
}

  var scenes = [], cur = null;
  (lines || []).forEach(function (l) {
    if (l.type === 'SCENE_HEADING') {
      cur = { heading: sbNormHeading(l.text), action: '', chars: [], dialogue: '' };
      scenes.push(cur);
    } else if (cur) {
      if (l.type === 'ACTION') cur.action += (cur.action ? ' ' : '') + (l.text || '');
      if (l.type === 'CHARACTER') {
        var c = String(l.text || '').replace(/\(.*\)/g, '').trim().toUpperCase();
        if (c && cur.chars.indexOf(c) < 0) cur.chars.push(c);
      }
      if (l.type === 'DIALOGUE') cur.dialogue += (cur.dialogue ? ' ' : '') + (l.text || '');
    }
  });

}

/* ---- reconcile a board against a script ---- */
/* board: [{heading, ...whatever the frame carries}]; scenes: from sbParseScenes */
function syncBoardToScript(board, scenes) {
  var exact = {}, base = {};
  for (var i = 0; i < scenes.length; i++) {
    exact[sbNormHeading(scenes[i].heading)] = i;
    base[sbBaseHeading(scenes[i].heading)] = i;
  }
  var frames = [];
  (board || []).forEach(function (f) {
    var h = sbNormHeading(f.heading), hb = sbBaseHeading(f.heading);
    var si = null;
    if (exact[h] != null) si = exact[h];
    else if (base[hb] != null) si = base[hb];
    else {
      for (var k = 0; k < scenes.length; k++) {                 // fuzzy: same INT./EXT. + first location token
        var sh = sbNormHeading(scenes[k].heading);
        if (sh.indexOf(h.split(' ').slice(0, 2).join(' ')) === 0) { si = k; break; }
      }
    }
    var copy = {};
    for (var key in f) copy[key] = f[key];
    if (si == null) { copy._si = 9999; copy.status = 'CUT'; }
    else { copy._si = si; }
    frames.push(copy);
  });
  var have = {};
  frames.forEach(function (f) { if (f._si !== 9999) have[f._si] = true; });
  for (var s = 0; s < scenes.length; s++) {
    if (!have[s]) {
      var inf = inferShot(scenes[s].heading, scenes[s].action);
      frames.push({ heading: scenes[s].heading, chars: scenes[s].chars.slice(0), action: scenes[s].action,
                    size: inf.size, angle: inf.angle, movement: inf.movement, lighting: inf.lighting,
                    status: 'DRAFT', _si: s, _new: true });
    }
  }
  frames.sort(function (x, y) { return x._si - y._si; });
  return frames;
}

/* ---- board back out to a working document ---- */
function exportBoardAsScript(frames) {
  var out = [], n = 0;
  (frames || []).forEach(function (f) {
    if (f.status === 'CUT') return;
    n++;
    var id = ('0' + n).slice(-2);
    out.push('FRAME ' + id + ' \u2014 ' + sbNormHeading(f.heading));
    out.push('Shot: ' + (f.size || '-') + ' | Angle: ' + (f.angle || '-') +
             ' | Movement: ' + (f.movement || '-') + ' | Lighting: ' + (f.lighting || '-'));
    if (f.chars && f.chars.length) out.push('Characters: ' + f.chars.join(', '));
    out.push('');
    if (f.action) { out.push('ACTION'); out.push(f.action); out.push(''); }
    if (f.hasPhoto) out.push('[VISUAL REFERENCE ATTACHED]');
    if (f.hasSketch) out.push('[SKETCH DRAWING PRESENT]');
    out.push('');
  });
  return out.join('\n');
}

if (typeof window !== 'undefined') {
  window.SB = { rules: SB_RULES, score: sbScore, inferShot: inferShot, parseScenes: sbParseScenes,
                sync: syncBoardToScript, exportScript: exportBoardAsScript,
                normHeading: sbNormHeading, baseHeading: sbBaseHeading };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { inferShot: inferShot, sync: syncBoardToScript, parseScenes: sbParseScenes,
                     exportScript: exportBoardAsScript };
}
})();

/* pdf writer */
(function(){
/* A very small PDF writer. No library, no network - it emits a real PDF 1.4 file with one full
   page per slide, Times/Helvetica text and images embedded as JPEG (DCTDecode).
   Limits, stated: text wraps by estimated glyph width rather than font metrics; PNGs are
   re-encoded through a canvas; no alpha, gradients or vectors. */
var PdfDeck = (function () {
  var W = 842, H = 595;
  function esc(s) {
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(')
      .replace(/\)/g, '\\)').replace(/[^\x20-\x7E]/g, '?');
  }
  function rgb(hex) {
    var h = String(hex || '#080C14').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function wrap(text, size, maxWidth, perChar) {
    var chars = Math.max(12, Math.floor(maxWidth / (size * (perChar || 0.5))));
    var words = String(text || '').split(/\s+/), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var t = line ? line + ' ' + words[i] : words[i];
      if (t.length > chars && line) { lines.push(line); line = words[i]; }
      else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }
  function jpeg(src) {
    return new Promise(function (res) {
      if (!src) return res(null);
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var cv = document.createElement('canvas');
          cv.width = img.naturalWidth || 1200; cv.height = img.naturalHeight || 800;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#080C14'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0);
          res({ dataUrl: cv.toDataURL('image/jpeg', 0.86), w: cv.width, h: cv.height });
        } catch (e) { res(null); }
      };
      img.onerror = function () { res(null); };
      img.src = src;
    });
  }
  function bytes(dataUrl) {
    var b64 = dataUrl.split(',')[1] || '';
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function build(pages) {
    var objs = [], offsets = [], body = '%PDF-1.4\n';
    function add(o) { objs.push(o); return objs.length; }
    var fT = add('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman >>');
    var fB = add('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold >>');
    var fH = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    var pageIds = [];
    pages.forEach(function (p) {
      var res = '/Font << /F1 ' + fT + ' 0 R /F2 ' + fB + ' 0 R /F3 ' + fH + ' 0 R >>';
      var imgId = null;
      if (p.image) {
        var b = bytes(p.image.dataUrl);
        imgId = add({ stream: b, dict: '<< /Type /XObject /Subtype /Image /Width ' + p.image.w +
          ' /Height ' + p.image.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + b.length + ' >>' });
        res += ' /XObject << /Im0 ' + imgId + ' 0 R >>';
      }
      var c = [], bg = rgb(p.bg), accent = rgb(p.accent);
      c.push('q ' + bg[0].toFixed(3) + ' ' + bg[1].toFixed(3) + ' ' + bg[2].toFixed(3) + ' rg 0 0 ' + W + ' ' + H + ' re f Q');
      if (imgId) {
        var s = Math.max(W / p.image.w, H / p.image.h);
        var iw = p.image.w * s, ih = p.image.h * s;
        c.push('q ' + iw.toFixed(1) + ' 0 0 ' + ih.toFixed(1) + ' ' + ((W - iw) / 2).toFixed(1) + ' ' +
               ((H - ih) / 2).toFixed(1) + ' cm /Im0 Do Q');
        c.push('q 0.031 0.047 0.078 rg 0 0 ' + W + ' ' + Math.round(H * 0.36) + ' re f Q');
      }
      var col = imgId ? [0.97, 0.96, 0.94] : [0.95, 0.94, 0.92];
      var lines = wrap(p.text, 30, W - 120, 0.48);
      var y = imgId ? Math.round(H * 0.26) : Math.round(H / 2 + lines.length * 16);
      c.push('BT /F1 30 Tf ' + col[0] + ' ' + col[1] + ' ' + col[2] + ' rg 60 ' + y + ' Td 38 TL');
      lines.forEach(function (ln, i) { c.push((i ? 'T* ' : '') + '(' + esc(ln) + ') Tj'); });
      c.push('ET');
      c.push('BT /F3 10 Tf ' + accent[0].toFixed(3) + ' ' + accent[1].toFixed(3) + ' ' + accent[2].toFixed(3) +
             ' rg 60 ' + Math.max(40, y - 48) + ' Td (' + esc(String(p.meta || '').toUpperCase()) + ') Tj ET');
      var stream = c.join('\n');
      var cid = add({ stream: stream, dict: '<< /Length ' + stream.length + ' >>' });
      pageIds.push(add('<< /Type /Page /Parent PAGES 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << ' +
        res + ' >> /Contents ' + cid + ' 0 R >>'));
    });
    var pagesId = objs.length + 1;
    add('<< /Type /Pages /Count ' + pageIds.length + ' /Kids [' +
        pageIds.map(function (i) { return i + ' 0 R'; }).join(' ') + '] >>');
    var catId = add('<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>');
    objs.forEach(function (o, i) {
      offsets[i] = body.length;
      if (typeof o === 'string') {
        body += (i + 1) + ' 0 obj\n' + o.replace('PAGES 0 R', pagesId + ' 0 R') + '\nendobj\n';
      } else {
        body += (i + 1) + ' 0 obj\n' + o.dict + '\nstream\n';
        var bin = '';
        for (var k = 0; k < o.stream.length; k++) {
          if (typeof o.stream[k] === 'number') bin += String.fromCharCode(o.stream[k]);
          else bin += o.stream[k];
        }
        body += bin + '\nendstream\nendobj\n';
      }
    });
    var xref = body.length;
    var x = 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    for (var i = 0; i < objs.length; i++) x += ('0000000000' + offsets[i]).slice(-10) + ' 00000 n \n';
    body += x + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catId + ' 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    return body;
  }
  function exportDeck(slides, opts) {
    opts = opts || {};
    return Promise.all(slides.map(function (s) { return jpeg(s.image); })).then(function (imgs) {
      var pages = slides.map(function (s, i) {
        return { text: s.text || '', meta: s.meta || '', accent: s.accent || opts.accent,
                 bg: opts.bg || '#080C14', image: imgs[i] };
      });
      var pdf = build(pages);
      var blob = new Blob([pdf], { type: 'application/pdf' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (opts.name || 'pitch-deck') + '.pdf';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return pdf.length;
    });
  }
  return { exportDeck: exportDeck, build: build, wrap: wrap };
})();

/* the module publishes itself, so no wrapper surgery is needed at assembly time */
if (typeof window !== 'undefined') { window.PdfDeck = PdfDeck; }
})();

var OB = { filter:'ALL', custom:[], letters:[], lastNudge:0, sel:null, letter:'' };

function obLoad() {
  try {
    OB.custom = JSON.parse(localStorage.getItem('ob_custom') || '[]');
    OB.letters = JSON.parse(localStorage.getItem('ob_letters') || '[]');
    OB.lastNudge = +(localStorage.getItem('ob_last_nudge') || 0);
  } catch (e) { OB.custom = []; OB.letters = []; OB.lastNudge = 0; }
}
function obSave() {
  try {
    localStorage.setItem('ob_custom', JSON.stringify(OB.custom));
    localStorage.setItem('ob_letters', JSON.stringify(OB.letters));
  } catch (e) {}
}
function obAll() { return OB_SEED.concat(OB.custom); }

function obScript() {
  var sp = ModalSync.get('screenplay:main') || {};
  var genres = [];
  try {
    var text = String(sp.content || '').toLowerCase();
    if (/blood|corpse|scream|ghost|haunt/.test(text)) genres.push('HORROR');
    if (/chase|gun|explosion|fight/.test(text)) genres.push('ACTION');
    if (/secret|investigat|betray/.test(text)) genres.push('THRILLER');
    if (/love|kiss|wedding/.test(text)) genres.push('ROMANCE');
    if (/court|election|president/.test(text)) genres.push('DRAMA');
  } catch (e) {}
  var title = (sp.filename || '').replace(/\.[a-z]+$/, '') || '';
  return { genres: genres, title: title, lines: (sp.lines || []).length };
}

function obPriority(c) {
  var s = 0, script = obScript();
  if (c.accept) s += 5;
  if (c.email) s += 2;
  if (c.contact) s += 1;
  if (c.tier === 'indie') s += 2; else if (c.tier === 'mid') s += 1;
  var matches = 0;
  (c.genres || []).forEach(function (g) { if (script.genres.indexOf(g) >= 0) matches++; });
  s += Math.min(15, matches * 3);
  return s;
}
function obStars(n) {
  var stars = Math.max(1, Math.min(5, Math.round(n / 5)));
  var out = '';
  for (var i = 0; i < 5; i++) out += (i < stars ? '\u2605' : '\u2606');
  return out;
}
function obTierColour(t) { return t === 'indie' ? '#34D399' : (t === 'mid' ? '#FBBF24' : '#F87171'); }

function obList() {
  var list = obAll().map(function (c) {
    var copy = {}; for (var k in c) copy[k] = c[k];
    copy._score = obPriority(c);
    return copy;
  });
  if (OB.filter === 'OPEN') list = list.filter(function (c) { return c.accept; });
  if (OB.filter === 'REP') list = list.filter(function (c) { return !c.accept; });
  if (OB.filter === 'TOP') list = list.filter(function (c) { return c._score >= 8; });
  list.sort(function (a, b) { return b._score - a._score; });
  return list;
}

function obLetter(c) {
  var script = obScript();
  var genre = script.genres[0] || 'drama';
  var project = script.title || 'the project';
  return 'Dear ' + (c.contact || c.name) + ',\n\n' +
    'I am writing about ' + project + ', a ' + genre.toLowerCase() + ' feature, ' + (script.lines || '?') +
    ' lines of script at present and moving toward production.\n\n' +
    'You take ' + (c.genres || []).join(', ').toLowerCase() + ' material' + (c.accept ?
      ' and consider unsolicited submissions' : ', though I understand you work through representatives') + '. ' +
    'That is exactly the company this was written for.\n\n' +
    'The letter is a short introduction; the script and a one-page summary are ready to send. ' +
    'Could I put them in front of you?\n\n' +
    'With thanks,\n' + (window.HUB_WRITER || 'the writer');
}
function obLog(c) {
  OB.letters.push({ id: 'l' + Date.now(), company: c.name, email: c.email || '', status: c.email ? 'Drafted' : 'Drafted',
                    at: new Date().toISOString(), genre: (obScript().genres[0] || '') });
  obSave(); obRender();
}
function obCSV() {
  var rows = [['Company','Status','Date','Email','Genre']];
  OB.letters.forEach(function (l) { rows.push([l.company, l.status, l.at, l.email, l.genre]); });
  var text = rows.map(function (r) {
    return r.map(function (x) { return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  try { navigator.clipboard.writeText(text); } catch (e) {}
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = 'outreach-log.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function obICS() {
  var script = obScript();
  var top = obList().slice(0, 3);
  var d = new Date();
  var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + ((8 - d.getDay()) % 7 || 7), 9, 0, 0);
  function stamp(x) {
    return x.getUTCFullYear() + ('0' + (x.getUTCMonth() + 1)).slice(-2) + ('0' + x.getUTCDate()).slice(-2) +
           'T' + ('0' + x.getUTCHours()).slice(-2) + ('0' + x.getUTCMinutes()).slice(-2) + '00Z';
  }
  var desc = 'Contacts: ' + top.map(function (c) { return c.name + (c.email ? ' <' + c.email + '>' : ''); }).join('; ');
  var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//proHUB//Outreach//EN','BEGIN:VEVENT',
    'UID:' + Date.now() + '@prohub', 'DTSTAMP:' + stamp(new Date()), 'DTSTART:' + stamp(next),
    'SUMMARY:Outreach - ' + (script.title || 'project'),
    'DESCRIPTION:' + desc.replace(/[,;]/g, ' '), 'RRULE:FREQ=WEEKLY;BYDAY=MO', 'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'outreach-nudge.ics'; document.body.appendChild(a); a.click(); a.remove();
}
function obNudge() {
  if (!OB.lastNudge || Date.now() - OB.lastNudge > 7 * 24 * 3600 * 1000) return obList().filter(function (c) {
    return !OB.letters.some(function (l) { return l.company === c.name; });
  }).slice(0, 3);
  return [];
}

var SL = (function () {
  var items = null;
  function load() {
    if (items) return items;
    items = SL_PACKED.split('\n').map(function (line) {
      var p = line.split('|');
      return { title: p[0] || '', slug: p[1] || '' };
    }).filter(function (x) { return x.title && x.slug; });
    items.sort(function (a, b) { return a.title.localeCompare(b.title); });
    return items;
  }
  function search(q) {
    var all = load(), s = String(q || '').trim().toLowerCase();
    if (!s) return all;
    return all.filter(function (x) { return x.title.toLowerCase().indexOf(s) >= 0; });
  }
  return { load: load, search: search };
})();

 }});
